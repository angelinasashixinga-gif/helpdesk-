<article class="cartao"[title]="ticket.descricao">

    <header>
        <span class="id">#{{ ticket.id }}</span>

        <h3>{{ ticket.titulo }}</h3>
    </header>

    <p>{{ ticket.descricao }}</p>

    <footer>
        <small>Categoria: {{ ticket.categoria }}</small>
        <small>Técnico: {{ ticket.tecnico }}</small>
    </footer>

    </article>
