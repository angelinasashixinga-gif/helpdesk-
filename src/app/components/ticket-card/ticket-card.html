<article
  class="ticket-card"
>

  <span>
    #{{ ticket().id }}
  </span>

  <h3>
    {{ ticket().titulo }}
  </h3>

  @if (mostrarDetalhes()) {
  <p>
    {{ ticket().descricao }}
  </p>
  }
  

  <p>
    <strong>Categoria:</strong> 
    {{ ticket().categoria }}
  </p>

  <p>
    <strong>Técnico:</strong>
    {{ ticket().tecnico ?? 'Não atribuído' }}
  </p>

  <button (click)="proximoEstado()">
    Avançar Estado
  </button>

  <button (click)="remover()">eliminar
  </button>

</article>
