<div class="cards-estatisticas">

  <a  [routerLink]="['/tickets']"
  [queryParams]="{ filtro: 'total' }">
>
    <app-cartao-estatistica
      titulo="Total de Tickets"
      [valor]="totalTickets()"
      icone="🎫"
      cor="#3498db">
    </app-cartao-estatistica>
  </a>

  <a [routerLink]="['/tickets']"
  [queryParams]="{ filtro: 'aberto' }">

    <app-cartao-estatistica
      titulo="Tickets Abertos"
      [valor]="totalAbertos()"
      icone="🔵"
      cor="#2980b9">
    </app-cartao-estatistica>
  </a>

  <a   [routerLink]="['/tickets']"
  [queryParams]="{ filtro: 'critica' }">
    <app-cartao-estatistica
      titulo="Tickets Críticos"
      [valor]="totalCriticos()"
      icone="🔴"
      cor="#e74c3c">
    </app-cartao-estatistica>
  </a>

  <a    [routerLink]="['/tickets']"
  [queryParams]="{ filtro: 'em-progresso' }">
    <app-cartao-estatistica
      titulo="Tickets Em progresso"
      [valor]="totalProgresso()"
      icone="🟡"
      cor="#e74c3c">
    </app-cartao-estatistica>
  </a>
  <a
  [routerLink]="['/tickets']"
  [queryParams]="{ filtro: 'fechado' }"
>
  <app-cartao-estatistica
    titulo="Tickets Fechados"
    [valor]="totalFechados()"
    icone="🔒"
    cor="#7f8c8d">
  </app-cartao-estatistica>
</a>

  <a routerLink="/tickets" class="card-link">
    <app-cartao-estatistica
      titulo="Tickets Resolvidos"
      [valor]="totalResolvidos()"
      icone="✅"
      cor="#27ae60">
    </app-cartao-estatistica>
  </a>
  <div class="resolucao">

    <div class="resolucao-header">
      <div>
        <h2>Taxa de resolução</h2>
        <p>Percentagem de tickets resolvidos</p>
      </div>

      <strong>
        {{ percentagemResolvidos() }}%
      </strong>
    </div>

    <div class="barra">
      <div
        class="barra-progresso"
        [style.width.%]="percentagemResolvidos()">
      </div>
    </div>

  </div>


</div>
