<section class="tickets-container">

  <h1>Tickets</h1>

  @if (ticketsFiltrados().length === 0) {

    <p>Nenhum ticket encontrado.</p>

  } @else {

    <div class="tickets-grid">

      @for (ticket of ticketsFiltrados(); track ticket.id) {

        <app-ticket-card
          [ticket]="ticket">
        </app-ticket-card>

      }

    </div>

  }

</section>
