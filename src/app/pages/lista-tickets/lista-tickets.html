<h2>Lista de Tickets</h2>

<p>Total de Tickets: {{ totalTickets() }}</p>

<button type="button" (click)="adicionarTicket()">
  Adicionar Ticket
</button>

<button type="button" (click)="limparLista()">
  Limpar Lista
</button>

<hr>

@for (ticket of tickets(); track ticket.id; 
  let i = $index;
  let par = $even;
  let impar = $odd
) {
 <div
    class="linha-ticket"
    [class.par]="par"
    [class.impar]="impar"
  >

    <app-ticket-card
      [ticket]="ticket"
      [mostrarDetalhes]="true"
      (estadoAlterado)="alterarEstado(ticket.id, $event)"
      (ticketRemovido)="removerTicket($event)"
    />
 </div>
}
@empty {

  <p class="sem-tickets">
    Não existem tickets registados.
  </p>

}
