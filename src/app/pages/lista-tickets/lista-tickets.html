<h2>Lista de Tickets</h2>

<input type="text"
placeholder="Pesquisar Ticket..."
(input)="pesquisar($event)"
>
<hr>
<div class="filtros">

  <button type="button" (click)="filtrar('todos')">
    Todos
  </button>

  <button type="button" (click)="filtrar('aberto')">
    Abertos
  </button>

  <button type="button" (click)="filtrar('em-processo')">
    Em processo
  </button>

  <button type="button" (click)="filtrar('resolvido')">
    Resolvidos
  </button>

  <button type="button" (click)="filtrar('fechado')">
    Fechados
  </button>
  <hr>

</div>

<p>Total de Tickets: {{ totalTickets() }}</p>

<button type="button" (click)="adicionarTicket()">
  Adicionar Ticket
</button>

<button type="button" (click)="limparLista()">
  Limpar Lista
</button>

<hr>

@for (ticket of ticketsFiltrados;
 track ticket.id; 
  let i = $index;
  let par = $even;
  let impar = $odd
) {
 <div
    class="linha-ticket"
    [class.par]="par"
    [class.impar]="impar"
  >

    <app-ticket-card
      [ticket]="ticket"
      [mostrarDetalhes]="true"
      (estadoAlterado)="alterarEstado(ticket.id, $event)"
      (ticketRemovido)="removerTicket($event)"
    />
 </div>
}
@empty {

  <p class="sem-tickets">
    Não existem tickets registados.
  </p>

}
