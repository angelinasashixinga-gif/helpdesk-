<h2>Lista de Tickets</h2>

<input type="text"
placeholder="Pesquisar Ticket..."
(input)="pesquisar($event)"
>
<hr>
<div class="filtros">

  <button
  type="button"
  [class.ativo]="filtroEstado() === 'todos'"
  (click)="filtrar('todos')"
>
  Todos ({{ totalTickets() }})
</button>

<button
  type="button"
  [class.ativo]="filtroEstado() === 'aberto'"
  (click)="filtrar('aberto')"
>
  Abertos ({{ contarPorEstado('aberto') }})
</button>

<button
  type="button"
  [class.ativo]="filtroEstado() === 'em-progresso'"
  (click)="filtrar('em-progresso')"
>
  Em processo ({{ contarPorEstado('em-progresso') }})
</button>

<button
  type="button"
  [class.ativo]="filtroEstado() === 'resolvido'"
  (click)="filtrar('resolvido')"
>
  Resolvidos ({{ contarPorEstado('resolvido') }})
</button>

<button
  type="button"
  [class.ativo]="filtroEstado() === 'fechado'"
  (click)="filtrar('fechado')"
>
  Fechados ({{ contarPorEstado('fechado') }})
</button>
  <hr>

</div>
<select
  (change)="filtrarPrioridade($event)"
>
  <option value="todas">Todas</option>
  <option value="baixa">Baixa</option>
  <option value="media">Média</option>
  <option value="alta">Alta</option>
  <option value="critica">Crítica</option>
</select>
  <button
  type="button"
  (click)="limparFiltros()">
  Limpar filtros
</button>
 <hr>

<p>Total de Tickets: {{ totalTickets() }}</p>

<button type="button" (click)="adicionarTicket()">
  Adicionar Ticket
</button>

<button type="button" (click)="limparLista()">
  Limpar Lista
</button>

<hr>

@for (ticket of ticketsFiltrados();
 track ticket.id; 
  let i = $index;
  let par = $even;
  let impar = $odd
) {
 <div
    class="linha-ticket"
    [class.par]="par"
    [class.impar]="impar"
  >

    <app-ticket-card
      [ticket]="ticket"
      [mostrarDetalhes]="true"
      (estadoAlterado)="alterarEstado(ticket.id, $event)"
      (ticketRemovido)="removerTicket($event)"
    />
 </div>
}
@empty {

  <p class="sem-tickets">
    Não existem tickets registados.
  </p>

}
