<section class="novo-ticket">

  <h1>Novo Ticket</h1>

  <p>
    Registe um novo pedido de suporte.
  </p>

  <form (submit)="guardar(); $event.preventDefault()">

    <div>
      <label for="titulo">
        Título
      </label>

      <input
        id="titulo"
        type="text"
        placeholder="Título do ticket"
        [value]="titulo()"
        (input)="titulo.set($any($event.target).value)"
      >
    </div>

    <div>
      <label for="descricao">
        Descrição
      </label>

      <textarea
        id="descricao"
        placeholder="Descreva o problema"
        [value]="descricao()"
        (input)="descricao.set($any($event.target).value)"
      ></textarea>
    </div>

    <div>
      <label for="prioridade">
        Prioridade
      </label>

      <select
        id="prioridade"
        [value]="prioridade()"
        (change)="prioridade.set($any($event.target).value)"
      >
        <option value="baixa">Baixa</option>
        <option value="media">Média</option>
        <option value="alta">Alta</option>
        <option value="critica">Crítica</option>
      </select>
    </div>

    <div>
      <label for="categoria">
        Categoria
      </label>

      <select
        id="categoria"
        [value]="categoria()"
        (change)="categoria.set($any($event.target).value)"
      >
        @for (cat of categorias; track cat) {
          <option [value]="cat">
            {{ cat }}
          </option>
        }
      </select>
    </div>

    <button type="button"(click)="guardar()">
      Criar Ticket
    </button>

  </form>

</section>
