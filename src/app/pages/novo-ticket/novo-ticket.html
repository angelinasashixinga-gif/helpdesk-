<div class="pagina-novo-ticket">

  <div class="cabecalho">

    <div>
      <h1>Novo Ticket</h1>
      <p>Registe um novo pedido de suporte.</p>
    </div>

  </div>


  <div class="formulario-container">

    <form (ngSubmit)="criarTicket()">

      <div class="campo">
        <label for="titulo">
          Título do ticket
        </label>

        <input
          id="titulo"
          type="text"
          name="titulo"
          [(ngModel)]="titulo"
          placeholder="Ex.: Computador não liga"
          required
        />
      </div>


      <div class="campo">
        <label for="descricao">
          Descrição
        </label>

        <textarea
          id="descricao"
          name="descricao"
          [(ngModel)]="descricao"
          placeholder="Descreva detalhadamente o problema..."
          rows="5"
          required
        ></textarea>
      </div>


      <div class="linha-campos">

        <div class="campo">
          <label for="prioridade">
            Prioridade
          </label>

          <select
            id="prioridade"
            name="prioridade"
            [(ngModel)]="prioridade">

            <option value="baixa">
              Baixa
            </option>

            <option value="media">
              Média
            </option>

            <option value="alta">
              Alta
            </option>

            <option value="critica">
              Crítica
            </option>

          </select>
        </div>


        <div class="campo">
          <label for="categoria">
            Categoria
          </label>

          <select
            id="categoria"
            name="categoria"
            [(ngModel)]="categoria">

            <option value="hardware">
              Hardware
            </option>

            <option value="software">
              Software
            </option>

            <option value="rede">
              Rede
            </option>

            <option value="acesso">
              Acesso
            </option>

          </select>
        </div>

      </div>


      <div class="acoes">

        <button
          type="button"
          class="btn-cancelar"
          (click)="cancelar()">

          Cancelar

        </button>

        <button
          type="submit"
          class="btn-criar">

          + Criar Ticket

        </button>

      </div>

    </form>

  </div>

</div>
